name: Modularize ACC Schedule Manager

on:
  push:
    paths:
      - "tools/modularize.py"
      - ".github/workflows/modularize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Split index into modular files
        run: python tools/modularize.py

      - name: Commit modularized application
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No modularization changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/styles.css assets/js
          git commit -m "Modularize schedule application"
          git push
